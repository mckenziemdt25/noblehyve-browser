name: Build Windows APPX for Microsoft Store

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'test_data/**'
      - 'test_encrypted_data/**'
      - 'test-*.js'
      - '*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure code signing
        shell: bash
        run: |
          if [ -n "${{ secrets.APPX_CERT_BASE64 }}" ]; then
            mkdir -p build
            echo "${{ secrets.APPX_CERT_BASE64 }}" | base64 -d > build/noblehyve-cert.pfx
            npm pkg set build.win.certificateFile="build/noblehyve-cert.pfx"
            echo "✅ Certificate decoded from secret"
          else
            echo "⚠️  No APPX_CERT_BASE64 secret set - skipping APPX build"
            echo "SKIP_APPX=true" >> "$GITHUB_ENV"
          fi

          PASSWORD="${{ secrets.APPX_CERT_PASSWORD }}"
          if [ -n "$PASSWORD" ]; then
            npm pkg set build.win.certificatePassword="$PASSWORD"
            echo "✅ Password set from secret"
          fi

      - name: Install Python setuptools (required by node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci
        env:
          GYP_MSVS_VERSION: 2022

      - name: Build APPX package
        if: env.SKIP_APPX != 'true'
        run: npx electron-builder --win appx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: env.SKIP_APPX != 'true'
        with:
          name: noblehyve-appx-${{ github.sha }}
          path: dist/*.appx
