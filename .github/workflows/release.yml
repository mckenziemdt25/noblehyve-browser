name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure code signing (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CERT_BASE64 }}" ]; then
            mkdir -p build
            echo "${{ secrets.WIN_CERT_BASE64 }}" | base64 -d > build/noblehyve-cert.pfx
            npm pkg set build.win.certificateFile="build/noblehyve-cert.pfx"
            npm pkg set build.win.certificatePassword="${{ secrets.WIN_CERT_PASSWORD }}"
            echo "Signing enabled"
          else
            echo "No signing certificate set - building unsigned"
          fi

      - name: Install Python setuptools (node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci
        env:
          GYP_MSVS_VERSION: 2022

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish always
        env:
          GYP_MSVS_VERSION: 2022
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux (AppImage + deb + rpm + tar.gz + pacman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Python setuptools (node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npx electron-builder --linux AppImage deb rpm tar.gz pacman --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
