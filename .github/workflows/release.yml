name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure code signing (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CERT_BASE64 }}" ]; then
            mkdir -p build
            echo "${{ secrets.WIN_CERT_BASE64 }}" | base64 -d > build/noblehyve-cert.pfx
            npm pkg set build.win.certificateFile="build/noblehyve-cert.pfx"
            npm pkg set build.win.certificatePassword="${{ secrets.WIN_CERT_PASSWORD }}"
            echo "Signing enabled"
          else
            echo "No signing certificate set - building unsigned"
          fi

      - name: Install Python setuptools (node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci
        env:
          GYP_MSVS_VERSION: 2022

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never
        env:
          GYP_MSVS_VERSION: 2022

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-linux:
    name: Linux (AppImage + deb + rpm + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Python setuptools (node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npx electron-builder --linux AppImage deb rpm tar.gz --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or replace release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          mapfile -t files < <(find artifacts -type f)
          gh release create "$tag" "${files[@]}" --generate-notes --title "$tag"
