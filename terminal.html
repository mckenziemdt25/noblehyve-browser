<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Terminal - NobleHyve</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0c0c0c; height: 100vh; overflow: hidden; }
        .terminal-container { display: flex; flex-direction: column; height: 100vh; }

        .terminal-header {
            background: #2d2d2d;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3e3e3e;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .terminal-title { font-size: 13px; font-weight: bold; color: #fff; font-family: sans-serif; }
        
        .shell-selector {
            display: flex;
            gap: 4px;
            background: #1e1e1e;
            border-radius: 6px;
            padding: 2px;
        }
        .shell-btn {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .shell-btn:hover {
            background: #3e3e3e;
        }
        .shell-btn.active {
            background: #0e639c;
            color: white;
        }

        #terminal-wrapper {
            flex: 1;
            padding: 4px;
            overflow: hidden;
            background: #0c0c0c;
        }

        .status-bar {
            background: #007acc;
            color: white;
            padding: 4px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
            font-family: monospace;
        }
        
        .shell-badge {
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
        }
    </style>
</head>
<body>
<div class="terminal-container">
    <div class="terminal-header">
        <div class="terminal-title">📟 NobleHyve Terminal</div>
        <div class="shell-selector" id="shellSelector">
        </div>
    </div>

    <div id="terminal-wrapper"></div>

    <div class="status-bar">
        <span id="terminalStatus">🟡 Starting...</span>
        <span>
            <span class="shell-badge" id="shellBadge">PowerShell</span>
            <span id="workingDir"></span>
        </span>
    </div>
</div>

<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script>
    // Current shell type
    let currentShell = 'powershell'; // 'powershell' or 'cmd'
    let currentSessionId = 'main';
    
    // Check if terminalAPI is available
    if (!window.terminalAPI) {
        console.error('terminalAPI not found!');
        document.getElementById('terminalStatus').textContent = '🔴 API Error';
    }

    // ── xterm.js setup ─────────────────────────────────────────────────
    const term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: "'Cascadia Code', 'Consolas', 'Monaco', monospace",
        theme: {
            background:  '#0c0c0c',
            foreground:  '#d4d4d4',
            cursor:      '#ffffff',
            black:       '#0c0c0c',
            red:         '#f48771',
            green:       '#6a9955',
            yellow:      '#ffaa44',
            blue:        '#569cd6',
            magenta:     '#c586c0',
            cyan:        '#4ec9b0',
            white:       '#d4d4d4',
            brightBlack: '#808080',
        },
        scrollback: 5000,
        convertEol: true,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-wrapper'));
    fitAddon.fit();

    // Resize observer
    new ResizeObserver(() => fitAddon.fit()).observe(document.getElementById('terminal-wrapper'));

    // Tell the PTY when the terminal size changes
    term.onResize(({ cols, rows }) => {
        if (window.terminalAPI && window.terminalAPI.resize) {
            window.terminalAPI.resize(currentSessionId, cols, rows);
        }
    });

    // ── Platform détection ──────────────────────────────────────────────
    let platform = 'linux';
    (async () => {
        try {
            const info = await window.terminalAPI.getSystemInfo();
            platform = info.platform;
        } catch (_) {}
        initShellSelector();
    })();

    const SHELLS = {
        linux:  { id: 'bash',   label: 'Bash',    args: [] },
        darwin: { id: 'zsh',    label: 'Zsh',     args: [] },
        win32:  { id: 'powershell', label: 'PowerShell', args: ['-NoLogo', '-ExecutionPolicy', 'RemoteSigned'] },
    };
    // Windows also offers CMD
    SHELLS.win32_alt = { id: 'cmd', label: 'CMD', args: [] };

    function getAvailableShells() {
        if (platform === 'win32') return [SHELLS.win32, SHELLS.win32_alt];
        if (platform === 'darwin') return [SHELLS.darwin];
        return [SHELLS.linux];
    }

    function initShellSelector() {
        const selector = document.getElementById('shellSelector');
        const shells = getAvailableShells();
        shells.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'shell-btn' + (i === 0 ? ' active' : '');
            btn.dataset.shell = s.id;
            btn.textContent = s.label;
            btn.addEventListener('click', () => switchShell(s.id));
            selector.appendChild(btn);
        });
        currentShell = shells[0].id;
        document.getElementById('shellBadge').textContent = shells[0].label;
    }

    // ── PTY wiring ─────────────────────────────────────────────────────
    term.onData((data) => {
        if (window.terminalAPI && window.terminalAPI.write) {
            window.terminalAPI.write(currentSessionId, data);
        }
    });

    if (window.terminalAPI && window.terminalAPI.onData) {
        window.terminalAPI.onData((data) => {
            term.write(data.data ?? data);
        });
    }

    if (window.terminalAPI && window.terminalAPI.onExit) {
        window.terminalAPI.onExit(({ id, exitCode }) => {
            if (id === currentSessionId) {
                document.getElementById('terminalStatus').textContent = '🔴 Session ended';
                term.write(`\r\n[Session ended — exit code ${exitCode}]\r\n`);
                term.write(`\r\n\x1b[33mClick the shell button to restart.\x1b[0m\r\n`);
            }
        });
    }

    if (window.terminalAPI && window.terminalAPI.onError) {
        window.terminalAPI.onError((err) => {
            term.write(`\r\n[Error: ${err}]\r\n`);
        });
    }

    // ── CWD tracking ──────────────────────────────────────────────────
    if (window.terminalAPI && window.terminalAPI.onCwdChanged) {
        window.terminalAPI.onCwdChanged(({ id, cwd }) => {
            if (id === currentSessionId) {
                document.getElementById('workingDir').textContent = cwd;
            }
        });
    }

    // ── Shell switching ──────────────────────────────────────────────────
    async function switchShell(shell) {
        if (shell === currentShell) return;

        currentShell = shell;
        const shells = getAvailableShells();
        const match = shells.find(s => s.id === shell);
        document.getElementById('shellBadge').textContent = match ? match.label : shell;

        document.querySelectorAll('.shell-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.shell === shell);
        });

        await startSession();
    }

    // ── Session management ──────────────────────────────────────────────────
    async function startSession() {
        document.getElementById('terminalStatus').textContent = '🟡 Starting...';

        if (!window.terminalAPI) {
            document.getElementById('terminalStatus').textContent = '🔴 API Missing';
            term.write('\r\n\x1b[31mERROR: terminalAPI not loaded!\x1b[0m\r\n');
            return;
        }

        // Kill existing session if any
        try {
            if (window.terminalAPI.kill) {
                await window.terminalAPI.kill(currentSessionId);
            }
        } catch(e) {}

        // Clear terminal
        term.clear();

        // Get current working directory
        let cwd = null;
        try {
            const cwdResult = await window.terminalAPI.getCwd(currentSessionId);
            if (cwdResult && cwdResult.success) {
                cwd = cwdResult.path;
                document.getElementById('workingDir').textContent = cwd;
            }
        } catch (err) {
            console.error('getCwd error:', err);
        }

        // Create new session — backend auto-detects the correct shell per platform
        try {
            const { cols, rows } = term;
            console.log('Starting session', `(${cols}x${rows})`);

            const result = await window.terminalAPI.createSession(currentSessionId, null, cwd, cols, rows);

            if (result && result.success) {
                const { cols, rows } = term;
                if (window.terminalAPI && window.terminalAPI.resize) {
                    window.terminalAPI.resize(currentSessionId, cols, rows);
                }
                document.getElementById('terminalStatus').textContent = '🟢 Ready';
                const shellName = result.shell || 'Terminal';
                term.write(`\x1b[32m✓ ${shellName} Ready\x1b[0m\r\n`);
                term.write('\x1b[36mType commands like "ls", "cd", or "npm install"\x1b[0m\r\n\r\n');
            } else {
                document.getElementById('terminalStatus').textContent = '🔴 Failed';
                term.write(`\r\n\x1b[31mCould not start terminal: ${result?.error || 'Unknown error'}\x1b[0m\r\n`);
            }
        } catch (err) {
            console.error('createSession error:', err);
            document.getElementById('terminalStatus').textContent = '🔴 Error';
            term.write(`\r\n\x1b[31mError creating session: ${err.message}\x1b[0m\r\n`);
        }

        term.focus();
    }

    // Kill PTY on close
    window.addEventListener('beforeunload', () => {
        try {
            if (window.terminalAPI && window.terminalAPI.kill) {
                window.terminalAPI.kill(currentSessionId);
            }
        } catch (_) {}
    });

    // Start the terminal once the shell selector is initialized
    const origInit = initShellSelector;
    initShellSelector = function() {
        origInit.call(this);
        startSession();
    };
</script>
</body>
</html>
