<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NobleHyve Code Editor</title>
    <link rel="stylesheet" href="node_modules/codemirror/lib/codemirror.css" />
    <link rel="stylesheet" href="node_modules/codemirror/theme/dracula.css" />
    <link rel="stylesheet" href="node_modules/codemirror/addon/fold/foldgutter.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            background: #2d2d2d;
            padding: 6px 10px;
            border-bottom: 1px solid #3e3e3e;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
        }
        .toolbar-btn {
            display: inline-flex; align-items: center; gap: 4px;
            background: transparent; color: #ccc;
            border: 1px solid transparent;
            padding: 4px 8px; border-radius: 4px;
            cursor: pointer; font-size: 12px;
            font-family: inherit;
            transition: all 0.12s ease;
            white-space: nowrap;
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
        .toolbar-btn:active { background: rgba(255,255,255,0.12); }
        .toolbar-btn.run-btn { color: #4caf50; }
        .toolbar-btn.run-btn:hover { background: rgba(76,175,80,0.15); border-color: rgba(76,175,80,0.25); }
        .toolbar-btn.preview-btn { color: #42a5f5; }
        .toolbar-btn.preview-btn:hover { background: rgba(66,165,245,0.15); border-color: rgba(66,165,245,0.25); }
        .toolbar-btn.stop-btn { color: #ef5350; }
        .toolbar-btn.stop-btn:hover { background: rgba(239,83,80,0.15); border-color: rgba(239,83,80,0.25); }
        .toolbar-btn.encrypt-btn { color: #ab47bc; }
        .toolbar-btn.encrypt-btn:hover { background: rgba(171,71,188,0.15); border-color: rgba(171,71,188,0.25); }
        .toolbar-btn.cloud-btn { color: #ffa726; }
        .toolbar-btn.cloud-btn:hover { background: rgba(255,167,38,0.15); border-color: rgba(255,167,38,0.25); }
        .toolbar-btn:disabled { opacity: 0.4; pointer-events: none; }

        .toolbar-separator {
            width: 1px; height: 20px;
            background: rgba(255,255,255,0.12);
            margin: 0 2px; flex-shrink: 0;
        }

        /* Toolbar group */
        .toolbar-group {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 2px 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 5px;
        }

        /* ===== LANGUAGE SELECT ===== */
        .lang-wrap {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px 2px 10px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .lang-wrap select {
            background: transparent; color: #ccc;
            border: none; outline: none;
            font-size: 12px; font-family: inherit;
            cursor: pointer; padding: 3px 0;
            min-width: 100px;
        }
        .lang-wrap select option { background: #2d2d2d; color: #ccc; }

        .cloud-badge {
            background: rgba(255,167,38,0.15);
            color: #ffa726;
            padding: 3px 10px; border-radius: 20px;
            font-size: 11px; white-space: nowrap;
        }

        /* ===== TABS ===== */
        .tabs-container {
            background: #252526;
            display: flex; overflow-x: auto; white-space: nowrap;
            flex-shrink: 0; border-bottom: 1px solid #3e3e3e;
            min-height: 36px; scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .tab {
            display: inline-flex; align-items: center;
            padding: 6px 10px 6px 14px;
            background: #2d2d2d; color: #999;
            cursor: pointer; font-size: 12px;
            min-width: 90px; max-width: 170px;
            position: relative; border-right: 1px solid #3e3e3e;
            transition: background 0.12s ease, color 0.12s ease;
        }
        .tab:hover { background: #333; color: #ccc; }
        .tab.active {
            background: #1e1e1e; color: #e0e0e0;
            box-shadow: inset 0 -2px 0 #007acc;
        }
        .tab.active .close-tab { color: #aaa; }
        .tab-title {
            flex: 1; overflow: hidden; text-overflow: ellipsis;
            margin-right: 4px; font-size: 12px;
        }
        .close-tab {
            padding: 1px 4px; border-radius: 3px;
            cursor: pointer; font-size: 11px; line-height: 1;
            color: transparent; transition: all 0.12s ease;
        }
        .tab:hover .close-tab { color: #888; }
        .close-tab:hover { background: rgba(239,83,80,0.3); color: #ef5350 !important; }
        .new-tab-btn {
            background: transparent; border: none; color: #888;
            padding: 6px 10px; cursor: pointer; font-size: 15px;
            transition: all 0.12s ease; line-height: 1;
        }
        .new-tab-btn:hover { color: #ccc; background: rgba(255,255,255,0.06); }

        /* ===== EDITOR + OUTPUT LAYOUT ===== */
        .editor-panel-container {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        .editor-container { flex: 1; position: relative; overflow: hidden; min-height: 100px; }
        .CodeMirror { height: 100% !important; font-size: 13px; }

        /* ===== OUTPUT PANEL ===== */
        .output-panel {
            flex-shrink: 0; height: 200px;
            background: #1e1e1e; border-top: 1px solid #3e3e3e;
            display: none; flex-direction: column;
        }
        .output-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 12px; background: #252526;
            border-bottom: 1px solid #3e3e3e;
            font-size: 11px; color: #888; flex-shrink: 0;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .output-actions { display: flex; gap: 2px; }
        .output-action-btn {
            background: none; border: none; color: #666;
            cursor: pointer; padding: 2px 6px; font-size: 12px;
            border-radius: 3px; transition: all 0.12s ease;
        }
        .output-action-btn:hover { background: rgba(255,255,255,0.08); color: #ccc; }
        .output-content {
            flex: 1; overflow-y: auto;
            padding: 8px 14px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px; color: #d4d4d4;
            white-space: pre-wrap; word-wrap: break-word;
            line-height: 1.6; scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .output-content .output-stdout { color: #d4d4d4; }
        .output-content .output-stderr { color: #f48771; }
        .output-content .output-error { color: #f44747; }
        .output-content .output-info { color: #6a9955; }
        .output-content .output-warn { color: #d7ba7d; }

        /* ===== PREVIEW ===== */
        .preview-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #1e1e1e; z-index: 10000;
            display: none; flex-direction: column;
        }
        .preview-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 14px; background: #2d2d2d;
            border-bottom: 1px solid #3e3e3e; flex-shrink: 0;
        }
        .preview-toolbar span { color: #ccc; font-size: 13px; }
        .preview-toolbar .close-btn {
            background: transparent; border: none; color: #888;
            padding: 4px 10px; border-radius: 4px; cursor: pointer;
            font-size: 14px; transition: all 0.12s ease;
        }
        .preview-toolbar .close-btn:hover { background: rgba(239,83,80,0.2); color: #ef5350; }
        .preview-frame { flex: 1; border: none; background: #fff; }

        /* ===== STATUS BAR ===== */
        .status-bar {
            background: #007acc; color: #fff;
            padding: 3px 14px; font-size: 11px;
            display: flex; justify-content: space-between;
            flex-shrink: 0; align-items: center;
        }
        .status-bar .status-left { display: flex; align-items: center; gap: 16px; }
        .status-bar .status-right { display: flex; align-items: center; gap: 12px; }
        .status-item { opacity: 0.9; }
        .status-item.modified { color: #ffd54f; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 50px; left: 50%;
            transform: translateX(-50%);
            background: #333; color: #fff;
            padding: 10px 22px; border-radius: 8px;
            z-index: 10001; display: none;
            font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }
        .toast.error { background: rgba(211,47,47,0.9); }
        .toast.success { background: rgba(56,142,60,0.9); }

        /* ===== MODALS ===== */
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 20000; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #2d2d2d;
            border-radius: 12px; padding: 24px;
            width: 90%; max-width: 380px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .modal-content h3 {
            margin-bottom: 16px;
            color: #e0e0e0; font-weight: 600;
            font-size: 15px;
        }
        .modal-content input {
            width: 100%; padding: 10px 12px;
            margin-bottom: 16px;
            background: #3c3c3c; border: 1px solid #555;
            border-radius: 6px; color: #fff; font-size: 13px;
            outline: none; transition: border-color 0.15s ease;
        }
        .modal-content input:focus { border-color: #007acc; }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn {
            padding: 7px 18px; border-radius: 5px;
            border: none; cursor: pointer; font-size: 12px;
            font-family: inherit; transition: all 0.12s ease;
        }
        .modal-btn.primary { background: #007acc; color: #fff; }
        .modal-btn.primary:hover { background: #1a8ae8; }
        .modal-btn.secondary { background: rgba(255,255,255,0.08); color: #ccc; }
        .modal-btn.secondary:hover { background: rgba(255,255,255,0.14); }

        /* ===== LIGHT THEME OVERRIDES ===== */
        body.light-theme { background: #f5f5f5; color: #333; }
        body.light-theme .toolbar { background: #e8e8e8; border-color: #ddd; }
        body.light-theme .toolbar-btn { color: #555; }
        body.light-theme .toolbar-btn:hover { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1); }
        body.light-theme .toolbar-group { background: rgba(0,0,0,0.04); }
        body.light-theme .lang-wrap { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
        body.light-theme .lang-wrap select { color: #333; }
        body.light-theme .lang-wrap select option { background: #fff; color: #333; }
        body.light-theme .tabs-container { background: #e0e0e0; border-color: #ddd; }
        body.light-theme .tab { background: #e8e8e8; color: #666; border-color: #ddd; }
        body.light-theme .tab:hover { background: #eee; color: #333; }
        body.light-theme .tab.active { background: #f5f5f5; color: #222; box-shadow: inset 0 -2px 0 #007acc; }
        body.light-theme .output-panel { background: #fafafa; border-color: #ddd; }
        body.light-theme .output-header { background: #e8e8e8; color: #888; }
        body.light-theme .output-content { color: #333; }
        body.light-theme .output-content .output-stdout { color: #333; }
        body.light-theme .output-content .output-stderr { color: #c62828; }
        body.light-theme .output-content .output-error { color: #d32f2f; }
        body.light-theme .output-content .output-info { color: #2e7d32; }
        body.light-theme .output-content .output-warn { color: #f9a825; }
        body.light-theme .status-bar { background: #007acc; }
        body.light-theme .modal-content { background: #fff; }
        body.light-theme .modal-content h3 { color: #333; }
        body.light-theme .modal-content input { background: #f5f5f5; border-color: #ccc; color: #333; }
        body.light-theme .modal-btn.secondary { background: rgba(0,0,0,0.06); color: #555; }
        body.light-theme .modal-btn.secondary:hover { background: rgba(0,0,0,0.1); }
        body.light-theme .cloud-badge { background: rgba(255,167,38,0.15); color: #e65100; }

    
    </style>
</head>
<body>

<div class="toolbar">

            <option value="json">JSON</option>
            <option value="dockerfile">Dockerfile</option>
            <option value="text">Plain Text</option>
        </select>
    </div>
    
    <span class="cloud-badge" id="cloudFileCount">☁️ 0</span>
    <span id="usageBadge" class="cloud-badge" style="background:rgba(76,175,80,0.15);color:#4caf50;font-size:10px">☁️ 5 left · 🔒 5 left</span>
</div>

<div class="tabs-container" id="tabsContainer">
    <button class="new-tab-btn" id="newTabBtn">+</button>
</div>

<!-- ===== EDITOR + OUTPUT LAYOUT ===== -->
<div class="editor-panel-container">
    <div class="editor-container">
        <textarea id="editor">// Welcome to NobleHyve Editor! ...</textarea>
       

    <!-- Output Panel -->
    <div id="outputPanel" class="output-panel" style="display: none;">
        <div class="output-header">
            <span id="outputTitle">▷ Output</span>
            <div class="output-actions">
                <button id="clearOutputBtn" class="output-action-btn" title="Clear">🗑️ Clear</button>

<script>
    let editor = null;
    let tabs = [];
    let activeTabId = null;
    let nextTabId = 1;
    let cloudFiles = [];
    let isPremium = false;
    let executionInProgress = false;
    let outputVisible = false;
    let usageStatus = null;
    
    class EditorTab {
        constructor(id, filename, content, language) {
            this.id = id;
            this.filename = filename;
            this.content = content;
            this.language = language;
            this.isModified = false;
            this.filePath = null;
            this.isEncrypted = false;
        }
    }
    
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
    
    function showInputModal(title, defaultValue = '') {
        return new Promise((resolve) => {
            const modal = document.getElementById('inputModal');
            const titleEl = document.getElementById('modalTitle');
            const input = document.getElementById('modalInput');
            const okBtn = document.getElementById('modalOkBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');
            titleEl.textContent = title;
            input.value = defaultValue;
            modal.style.display = 'flex';
            input.focus();
            const onOk = () => { modal.style.display = 'none'; resolve(input.value); };
            const onCancel = () => { modal.style.display = 'none'; resolve(null); };
            okBtn.onclick = onOk;
            cancelBtn.onclick = onCancel;
            input.onkeypress = (e) => { if (e.key === 'Enter') onOk(); };
        });
    }
    
    function showPasswordModal(title) {
        return new Promise((resolve) => {
            const modal = document.getElementById('passwordModal');
            const titleEl = document.getElementById('passwordModalTitle');
            const input = document.getElementById('passwordModalInput');
            const okBtn = document.getElementById('passwordModalOkBtn');
            const cancelBtn = document.getElementById('passwordModalCancelBtn');
            titleEl.textContent = title;
            input.value = '';
            modal.style.display = 'flex';
            input.focus();
            const onOk = () => { modal.style.display = 'none'; resolve(input.value); };
            const onCancel = () => { modal.style.display = 'none'; resolve(null); };
            okBtn.onclick = onOk;
            cancelBtn.onclick = onCancel;
            input.onkeypress = (e) => { if (e.key === 'Enter') onOk(); };
        });
    }
    
    function getDefaultContent(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        if (ext === 'html') {
            return `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My App</title>

function updateTabsUI() {
    const tabsContainer = document.getElementById('tabsContainer');
    const newTabBtn = document.getElementById('newTabBtn');
    
    // Remove existing tabs (keep the "+" button)
    const existingTabs = tabsContainer.querySelectorAll('.tab');
    existingTabs.forEach(tab => tab.remove());

    tabs.forEach(tab => {
        const tabBtn = document.createElement('div');
        tabBtn.className = 'tab';
        if (activeTabId === tab.id) tabBtn.classList.add('active');
        tabBtn.dataset.tabId = tab.id;

        // Show modified indicator (*) if the file has unsaved changes
        const titleText = tab.isModified ? `${tab.filename} *` : tab.filename;
        tabBtn.innerHTML = `<span class="tab-title">${titleText}</span><span class="close-tab">✖</span>`;

        // Switch tab on click (but not on close button)
        tabBtn.addEventListener('click', (e) => {
            if (!e.target.classList.contains('close-tab')) switchToTab(tab.id);
        });

        // Close tab
        tabBtn.querySelector('.close-tab').addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(tab.id);
        });

        // Double-click to rename
        tabBtn.querySelector('.tab-title').addEventListener('dblclick', (e) => {
            e.stopPropagation();
            renameTab(tab.id);
        });

        tabsContainer.insertBefore(tabBtn, newTabBtn);
    });
}

async function renameTab(id) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;

    const newName = prompt('Rename file:', tab.filename);
    if (!newName || newName.trim() === '' || newName === tab.filename) return;

    const oldName = tab.filename;
    const oldPath = tab.filePath;

    // Update tab object
    tab.filename = newName.trim();
    // Update language if extension changed
    const newLang = getLanguageFromFilename(tab.filename);
    if (newLang !== tab.language) {
        tab.language = newLang;
    }
    tab.isModified = true;  // filename change is a modification
    updateUIForTab(tab);
    updateTabsUI();
    showToast(`Renamed to ${tab.filename}`, 'success');

    // If the file has a physical path, rename the actual file on disk
    if (oldPath) {
        const result = await window.editorAPI.renameFile(oldPath, tab.filename);
        if (result.success) {
            tab.filePath = result.newPath;
            showToast(`File renamed on disk`, 'success');
        } else {
            showToast(`Could not rename file on disk: ${result.error}`, 'error');
            // Optionally revert the tab name? We'll keep it as is, but user should know.
        }
    }
}
    
    function switchToTab(id) {
        const tab = tabs.find(t => t.id === id);
        if (!tab) return;
        if (activeTabId !== null) {
            const oldTab = tabs.find(t => t.id === activeTabId);
            if (oldTab) oldTab.content = editor.getValue();
        }
        activeTabId = id;
        updateUIForTab(tab);
        updateTabsUI();
        updateWorkspaceDisplay();
    }
    
    function createNewTab(filename = null, content = null) {
        const id = nextTabId++;
        const tabFilename = filename || `Untitled_${id}.js`;
        const tabContent = content || getDefaultContent(tabFilename);
        const language = getLanguageFromFilename(tabFilename);
        const tab = new EditorTab(id, tabFilename, tabContent, language);
        tabs.push(tab);
        updateTabsUI();
        switchToTab(id);
        return id;
    }
    
    async function closeTab(id) {
        if (tabs.length === 1) {
            const currentTab = tabs[0];
            if (currentTab.isModified) {
                if (confirm(`Save "${currentTab.filename}" before clearing?`)) await saveCurrentFile();
            }
            currentTab.content = getDefaultContent(currentTab.filename);
            currentTab.isModified = false;
            currentTab.filePath = null;
            currentTab.isEncrypted = false;
            editor.setValue(currentTab.content);
            updateUIForTab(currentTab);
            updateTabsUI();
            showToast('Tab cleared. Create new tabs with the + button', 'info');
            return;
        }
        const tab = tabs.find(t => t.id === id);
        if (!tab) return;
        if (tab.isModified) {
            if (confirm(`Save "${tab.filename}" before closing?`)) await saveCurrentFileForTab(tab);
        }
        const index = tabs.findIndex(t => t.id === id);
        tabs.splice(index, 1);
        if (tabs.length > 0) {
            const newActiveId = tabs[Math.min(index, tabs.length - 1)].id;
            switchToTab(newActiveId);
        }
        updateTabsUI();
        showToast(`Closed: ${tab.filename}`, 'info');
    }
    
    async function saveCurrentFileForTab(tab) {
        tab.content = editor.getValue();
        if (tab.filePath) {
            const r = await window.editorAPI.writeFile(tab.filePath, tab.content);
            if (r.success) { tab.isModified = false; showToast(`✅ Saved: ${tab.filename}`, 'success'); }
        } else {
            const r = await window.editorAPI.showSaveDialog({ defaultPath: tab.filename });
            if (!r.canceled) {
                const w = await window.editorAPI.writeFile(r.filePath, tab.content);
                if (w.success) {
                    tab.filePath = r.filePath;
                    tab.isModified = false;
                    tab.filename = r.filePath.split(/[/\\]/).pop();
                    showToast(`✅ Saved: ${tab.filename}`, 'success');
                    updateTabsUI();
                }
            }
        }
        const dir = getFileDirSimple(tab);
        if (dir) { await window.editorAPI.setWorkspace(dir); updateWorkspaceDisplay(); }
    }
    
    async function saveCurrentFile() {
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return;
        await saveCurrentFileForTab(t);
        document.getElementById('statusText').innerHTML = 'Ready';
        updateTabsUI();
    }
    
async function openFile() {
    const r = await window.editorAPI.showOpenDialog();
    if (r.canceled) return;

    const filePath = r.filePaths[0];

    try {
        const c = await window.editorAPI.readFile(filePath);

        if (c.success) {
            const filename = filePath.split(/[/\\]/).pop();
            createNewTab(filename, c.content);
            const t = tabs[tabs.length - 1];
            t.filePath = filePath;
            t.isEncrypted = filename.endsWith('.enc');
            t.isModified = false;
            showToast(`📂 Opened: ${filename}`, 'success');
            const dir = getFileDirSimple(t);
            if (dir) { await window.editorAPI.setWorkspace(dir); updateWorkspaceDisplay(); }
        } else {
            showToast(`Failed to read file: ${c.error}`, 'error');
        }
    } catch (err) {
        showToast(`Error opening file: ${err.message}`, 'error');
    }
}
    
    async function saveEncryptedToFile() {
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return;
        t.content = editor.getValue();
        if (!usageStatus) await loadUsageStatus();
        if (!usageStatus.isPremium && usageStatus.localEncrypts.remaining <= 0) {
            showToast('Free limit reached (5 local encrypts). Get Premium for unlimited use.', 'error');
            return;
        }
        const fn = await showInputModal('Save encrypted file:', t.filename.replace(/\.enc$/, '') + '.enc');
        if (!fn) return;
        const finalFile = fn.endsWith('.enc') ? fn : fn + '.enc';
        const pw = await showPasswordModal('Enter encryption password:');
        if (!pw) return;
        const pw2 = await showPasswordModal('Confirm password:');
        if (pw !== pw2) { showToast('Passwords do not match!', 'error'); return; }
        const r = await window.editorAPI.saveEncryptedFile(finalFile, t.content, pw);
        if (r.success) {
            t.filePath = r.path; t.isEncrypted = true; t.isModified = false; t.filename = finalFile;
            showToast(`✅ Encrypted: ${finalFile}`, 'success');
            updateTabsUI();
            await loadUsageStatus();
        } else {
            showToast('Encryption failed: ' + (r.error || 'Unknown error'), 'error');
        }
    }

    async function uploadToCloud() {
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return;
        t.content = editor.getValue();
        if (!usageStatus) await loadUsageStatus();
        if (!usageStatus.isPremium && usageStatus.cloudSaves.remaining <= 0) {
            showToast('Free limit reached (5 cloud saves). Get Premium for unlimited use.', 'error');
            return;
        }
        const contentBytes = new TextEncoder().encode(t.content).length;
        if (!usageStatus.isPremium && contentBytes > 5 * 1024 * 1024) {
            showToast('Free limit: file too large (max 5MB). Upgrade to Premium.', 'error');
            return;
        }
        const fn = await showInputModal('Enter filename:', t.filename);
        if (!fn) return;
        const pw = await showPasswordModal('Enter encryption password:');
        if (!pw) return;
        const pw2 = await showPasswordModal('Confirm password:');
        if (pw !== pw2) { showToast('Passwords do not match!', 'error'); return; }
        showToast('Encrypting and uploading...', 'info');
        try {
            const enc = await window.editorAPI.encryptContent(t.content, pw);
            const r = await window.editorAPI.uploadToCloud(fn, enc);
            if (r.success) { showToast(`✅ Saved "${fn}" to cloud!`, 'success'); await loadCloudFiles(); await loadUsageStatus(); }
            else { showToast('Upload failed: ' + r.error, 'error'); }
        } catch (e) { showToast('Upload failed: ' + e.message, 'error'); }
    }
    
    async function restoreFromCloud() {
        if (cloudFiles.length === 0) await loadCloudFiles();
        if (cloudFiles.length === 0) { showToast('No files in cloud', 'info'); return; }
        const list = cloudFiles.map((f, i) => `${i+1}. ${f.name}`).join('\n');
        const fn = await showInputModal(`Select file:\n${list}\n\nEnter filename:`);
        if (!fn) return;
        const pw = await showPasswordModal(`Enter password for "${fn}":`);
        if (!pw) return;
        showToast('Downloading...', 'info');
        try {
            const r = await window.editorAPI.downloadFromCloud(fn);
            const dec = await window.editorAPI.decryptContent(r.content, pw);
            if (dec) { createNewTab(fn, dec); showToast(`✅ Restored "${fn}"!`, 'success'); }
            else { showToast('Wrong password!', 'error'); }
        } catch (e) { showToast('Restore failed: ' + e.message, 'error'); }
    }

    async function runCode() {
        if (executionInProgress) { appendOutput('Execution already in progress', 'output-warn'); return; }
        const tab = getActiveCode();
        if (!tab) return;
        
        clearOutput();
        appendOutput(`▶ Running ${tab.filename} (${tab.language})...`, 'output-info');
        
        const lang = tab.language;
        const code = tab.content;
        executionInProgress = true;
        document.getElementById('runBtn').disabled = true;
        document.getElementById('stopBtn').style.display = 'inline-block';
        
        try {
            if (lang === 'javascript') {
                await runJavaScript(code);
            } else if (lang === 'html') {
                await runHTML(code);
            } else if (lang === 'css') {
                appendOutput('CSS cannot be run directly. Use it within an HTML file.', 'output-warn');
            } else if (runnableViaMain.includes(lang)) {
                await runViaMainProcess(lang, code);
            } else {
                appendOutput(`No execution strategy for "${lang}"`, 'output-warn');
            }
        } catch (err) {
            appendOutput(`Error: ${err.message || err}`, 'output-error');
        }
        
        executionInProgress = false;
        document.getElementById('runBtn').disabled = false;
        document.getElementById('stopBtn').style.display = 'none';
        appendOutput('', 'output-info');
        appendOutput('═══════════════════════', 'output-info');
        appendOutput('Execution finished', 'output-info');
    }
    
    function runJavaScript(code) {
        return new Promise((resolve) => {
            const output = [];
            const fakeConsole = {
                log: (...args) => { output.push(args.map(String).join(' ')); appendOutput(args.map(String).join(' ')); },
                warn: (...args) => { output.push('⚠ ' + args.map(String).join(' ')); appendOutput(args.map(String).join(' '), 'output-warn'); },
                error: (...args) => { output.push('✖ ' + args.map(String).join(' ')); appendOutput(args.map(String).join(' '), 'output-stderr'); },
                info: (...args) => { output.push('ℹ ' + args.map(String).join(' ')); appendOutput(args.map(String).join(' '), 'output-info'); }
            };
            try {
                const wrapped = `(function(console){ ${code} \n})`;
                const fn = eval(wrapped);
                const result = fn(fakeConsole);
                if (result !== undefined && result !== null) {
                    appendOutput(`=> ${result}`, 'output-info');
                }
            } catch (e) {
                appendOutput(`${e.name}: ${e.message}`, 'output-error');
            }
            resolve();
        });
    }
    
    function runHTML(code) {
        return new Promise((resolve) => {
            showPreview(code);
            appendOutput('HTML rendered in preview panel', 'output-info');
            resolve();
        });
    }
    
    async function runViaMainProcess(lang, code) {
        appendOutput(`Executing via system (${lang})...`, 'output-info');
        try {
            const result = await window.editorAPI.executeCode({ language: lang, code: code });
            if (result.success) {
                if (result.stdout) appendOutput(result.stdout);
                if (result.stderr) appendOutput(result.stderr, 'output-stderr');
                if (result.exitCode !== 0) appendOutput(`Exit code: ${result.exitCode}`, 'output-error');
            } else {
                appendOutput(`Execution failed: ${result.error}`, 'output-error');
            }
        } catch (e) {
            appendOutput(`Failed to execute: ${e.message}`, 'output-error');
        }
    }

    function getFileDirSimple(tab) {
        if (!tab || !tab.filePath) return null;
        const idx = Math.max(tab.filePath.lastIndexOf('/'), tab.filePath.lastIndexOf('\\'));
        return idx >= 0 ? tab.filePath.substring(0, idx) : null;
    }
    
    async function updateWorkspaceDisplay() {
        const tab = tabs.find(t => t.id === activeTabId);
        let dir = null;
        if (tab && tab.filePath) {
            dir = getFileDirSimple(tab);
        }
        if (!dir) {
            try {
                const ws = await window.editorAPI.getWorkspace();
                if (ws.success && ws.dir) dir = ws.dir;
            } catch (_) {}
        }
        const el = document.getElementById('workspaceDisplay');
        if (el) el.textContent = dir ? `📁 ${dir}` : '📁 —';
        return dir;
    }
    
    async function sendCodeToTerminal(runInsteadOfSend) {
        const tab = getActiveCode();
        if (!tab) return;
        const code = tab.content;
        const dir = getFileDirSimple(tab);
        if (dir) await window.editorAPI.setWorkspace(dir);
        
        if (runInsteadOfSend) {
            // Send with cd + execute, then newline to trigger run
            await window.editorAPI.sendToTerminal(code, dir);
            appendOutput(`🖥️ Sent to terminal (${tab.filename})`, 'output-info');
        } else {
            // Just send the code text, don't execute
            await window.editorAPI.sendToTerminal('', dir);  // just cd
            await window.editorAPI.sendToTerminal(code, null);
            appendOutput(`📤 Code sent to terminal`, 'output-info');
        }
        showToast('Sent to terminal', 'success');
    }

            document.getElementById('stopBtn').style.display = 'none';
            appendOutput('Execution stopped by user', 'output-warn');
        });
        
        // Terminal integration buttons
        document.getElementById('runTerminalBtn')?.addEventListener('click', () => sendCodeToTerminal(true));
        document.getElementById('sendToTerminalBtn')?.addEventListener('click', () => sendCodeToTerminal(false));
        
        // Output panel buttons
        document.getElementById('clearOutputBtn')?.addEventListener('click', clearOutput);
        document.getElementById('closeOutputBtn')?.addEventListener('click', hideOutput);
        
        // Preview close
        document.getElementById('closePreviewBtn')?.addEventListener('click', closePreview);
        
        // Language selector
        document.getElementById('languageSelect')?.addEventListener('change', (e) => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.language = e.target.value;
                editor.setOption('mode', modeMap[e.target.value] || null);
                const previewBtn = document.getElementById('previewBtn');
                if (previewBtn) previewBtn.style.display = (e.target.value === 'html') ? 'inline-block' : 'none';
            }
        });
        
        await loadUsageStatus();
        await loadCloudFiles();
        createNewTab();
        await updateWorkspaceDisplay();
        
        console.log('Editor ready!');
        showToast('✨ Editor ready! Ctrl+Enter to run code. 🖥️ Run in Terminal for live output.', 'success');
    });
</script>
</body>
</html>
