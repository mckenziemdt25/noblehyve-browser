<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NobleHyve Code Editor</title>
    <link rel="stylesheet" href="node_modules/codemirror/lib/codemirror.css" />
    <link rel="stylesheet" href="node_modules/codemirror/theme/dracula.css" />
    <link rel="stylesheet" href="node_modules/codemirror/addon/fold/foldgutter.css" />
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            background: #2d2d2d;
            padding: 6px 10px;
            border-bottom: 1px solid #3e3e3e;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
        }
        .toolbar-btn {
            display: inline-flex; align-items: center; gap: 4px;
            background: transparent; color: #ccc;
            border: 1px solid transparent;
            padding: 4px 8px; border-radius: 4px;
            cursor: pointer; font-size: 12px;
            font-family: inherit;
            transition: all 0.12s ease;
            white-space: nowrap;
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
        .toolbar-btn:active { background: rgba(255,255,255,0.12); }
        .toolbar-btn.run-btn { color: #4caf50; }
        .toolbar-btn.run-btn:hover { background: rgba(76,175,80,0.15); border-color: rgba(76,175,80,0.25); }
        .toolbar-btn.preview-btn { color: #42a5f5; }
        .toolbar-btn.preview-btn:hover { background: rgba(66,165,245,0.15); border-color: rgba(66,165,245,0.25); }
        .toolbar-btn.stop-btn { color: #ef5350; }
        .toolbar-btn.stop-btn:hover { background: rgba(239,83,80,0.15); border-color: rgba(239,83,80,0.25); }
        .toolbar-btn.encrypt-btn { color: #ab47bc; }
        .toolbar-btn.encrypt-btn:hover { background: rgba(171,71,188,0.15); border-color: rgba(171,71,188,0.25); }
        .toolbar-btn.cloud-btn { color: #ffa726; }
        .toolbar-btn.cloud-btn:hover { background: rgba(255,167,38,0.15); border-color: rgba(255,167,38,0.25); }
        .toolbar-btn:disabled { opacity: 0.4; pointer-events: none; }
        .toolbar-btn.active { background: rgba(0,122,204,0.2); border-color: rgba(0,122,204,0.4); color: #4fc3f7; }

        .toolbar-separator {
            width: 1px; height: 20px;
            background: rgba(255,255,255,0.12);
            margin: 0 2px; flex-shrink: 0;
        }

        /* Toolbar group */
        .toolbar-group {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 2px 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 5px;
        }

        /* ===== LANGUAGE SELECT ===== */
        .lang-wrap {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px 2px 10px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .lang-wrap select {
            background: transparent; color: #ccc;
            border: none; outline: none;
            font-size: 12px; font-family: inherit;
            cursor: pointer; padding: 3px 0;
            min-width: 100px;
        }
        .lang-wrap select option { background: #2d2d2d; color: #ccc; }

        .cloud-badge {
            background: rgba(255,167,38,0.15);
            color: #ffa726;
            padding: 3px 10px; border-radius: 20px;
            font-size: 11px; white-space: nowrap;
        }

        /* ===== TABS ===== */
        .tabs-container {
            background: #252526;
            display: flex; overflow-x: auto; white-space: nowrap;
            flex-shrink: 0; border-bottom: 1px solid #3e3e3e;
            min-height: 36px; scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .tab {
            display: inline-flex; align-items: center;
            padding: 6px 10px 6px 14px;
            background: #2d2d2d; color: #999;
            cursor: pointer; font-size: 12px;
            min-width: 90px; max-width: 170px;
            position: relative; border-right: 1px solid #3e3e3e;
            transition: background 0.12s ease, color 0.12s ease;
        }
        .tab:hover { background: #333; color: #ccc; }
        .tab.active {
            background: #1e1e1e; color: #e0e0e0;
            box-shadow: inset 0 -2px 0 #007acc;
        }
        .tab.active .close-tab { color: #aaa; }
        .tab-title {
            flex: 1; overflow: hidden; text-overflow: ellipsis;
            margin-right: 4px; font-size: 12px;
        }
        .close-tab {
            padding: 1px 4px; border-radius: 3px;
            cursor: pointer; font-size: 11px; line-height: 1;
            color: transparent; transition: all 0.12s ease;
        }
        .tab:hover .close-tab { color: #888; }
        .close-tab:hover { background: rgba(239,83,80,0.3); color: #ef5350 !important; }
        .new-tab-btn {
            background: transparent; border: none; color: #888;
            padding: 6px 10px; cursor: pointer; font-size: 15px;
            transition: all 0.12s ease; line-height: 1;
        }
        .new-tab-btn:hover { color: #ccc; background: rgba(255,255,255,0.06); }

        /* ===== EDITOR + OUTPUT LAYOUT ===== */
        .editor-panel-container {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        .editor-container { flex: 1; position: relative; overflow: hidden; min-height: 100px; }
        .CodeMirror { height: 100% !important; font-size: 13px; }

        /* ===== BOTTOM PANEL (Terminal + Output) ===== */
        .bottom-panel {
            flex-shrink: 0; height: 250px;
            background: #1e1e1e; border-top: 1px solid #3e3e3e;
            display: none; flex-direction: column;
            position: relative;
        }
        .bottom-panel.open { display: flex; }
        .panel-tabs {
            display: flex; align-items: center;
            padding: 0 12px; background: #252526;
            border-bottom: 1px solid #3e3e3e; flex-shrink: 0;
            gap: 0;
        }
        .panel-tab {
            padding: 6px 14px; font-size: 11px; color: #888;
            cursor: pointer; border-bottom: 2px solid transparent;
            text-transform: uppercase; letter-spacing: 0.06em;
            transition: all 0.12s ease; user-select: none;
        }
        .panel-tab:hover { color: #ccc; }
        .panel-tab.active {
            color: #e0e0e0;
            border-bottom-color: #007acc;
        }
        .panel-tab .tab-badge {
            display: inline-block; margin-left: 4px;
            font-size: 10px; opacity: 0.6;
        }
        .panel-body {
            flex: 1; overflow: hidden; position: relative;
        }
        .panel-body > .tab-content {
            display: none; width: 100%; height: 100%;
        }
        .panel-body > .tab-content.active { display: block; }
        #terminalContainer { padding: 0; }
        #terminalContainer .xterm { height: 100%; padding: 4px; }
        #terminalContainer .xterm-viewport { scrollbar-width: thin; }
        
        /* Output inside bottom panel */
        .panel-output {
            padding: 6px 14px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px; color: #d4d4d4;
            white-space: pre-wrap; word-wrap: break-word;
            line-height: 1.5; overflow-y: auto; height: 100%;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .panel-output .output-stdout { color: #d4d4d4; }
        .panel-output .output-stderr { color: #f48771; }
        .panel-output .output-error { color: #f44747; }
        .panel-output .output-info { color: #6a9955; }
        .panel-output .output-warn { color: #d7ba7d; }
        
        /* Resize handle (sits between editor and bottom panel) */
        .panel-resize-handle {
            flex-shrink: 0; height: 8px;
            cursor: ns-resize; z-index: 10;
            background: #252526;
            border-top: 1px solid #3e3e3e;
            border-bottom: 1px solid #3e3e3e;
            display: none;
            align-items: center; justify-content: center;
            position: relative;
            transition: background 0.15s;
        }
        .panel-resize-handle::after {
            content: ''; width: 40px; height: 3px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px; transition: background 0.15s;
        }
        .panel-resize-handle:hover { background: #2d2d2d; }
        .panel-resize-handle:hover::after { background: #007acc; }
        .panel-resize-handle.active::after { background: #007acc; }
        body.light-theme .panel-resize-handle { background: #e0e0e0; border-color: #d0d0d0; }
        body.light-theme .panel-resize-handle { height: 8px; }
        body.light-theme .panel-resize-handle::after { background: rgba(0,0,0,0.2); }
        body.light-theme .panel-resize-handle:hover { background: #d0d0d0; }
        body.light-theme .panel-resize-handle:hover::after { background: #007acc; }
        
        .panel-actions {
            display: flex; align-items: center; gap: 4px;
            margin-left: auto;
        }
        .panel-action-btn {
            background: none; border: none; color: #666;
            cursor: pointer; padding: 3px 6px; font-size: 12px;
            border-radius: 3px; transition: all 0.12s ease;
            line-height: 1;
        }
        .panel-action-btn:hover { background: rgba(255,255,255,0.08); color: #ccc; }

        /* ===== PREVIEW ===== */
        .preview-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #1e1e1e; z-index: 10000;
            display: none; flex-direction: column;
        }
        .preview-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 14px; background: #2d2d2d;
            border-bottom: 1px solid #3e3e3e; flex-shrink: 0;
        }
        .preview-toolbar span { color: #ccc; font-size: 13px; }
        .preview-toolbar .close-btn {
            background: transparent; border: none; color: #888;
            padding: 4px 10px; border-radius: 4px; cursor: pointer;
            font-size: 14px; transition: all 0.12s ease;
        }
        .preview-toolbar .close-btn:hover { background: rgba(239,83,80,0.2); color: #ef5350; }
        .preview-frame { flex: 1; border: none; background: #fff; }

        /* ===== STATUS BAR ===== */
        .status-bar {
            background: #007acc; color: #fff;
            padding: 3px 14px; font-size: 11px;
            display: flex; justify-content: space-between;
            flex-shrink: 0; align-items: center;
        }
        .status-bar .status-left { display: flex; align-items: center; gap: 16px; }
        .status-bar .status-right { display: flex; align-items: center; gap: 12px; }
        .status-item { opacity: 0.9; }
        .status-item.modified { color: #ffd54f; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 50px; left: 50%;
            transform: translateX(-50%);
            background: #333; color: #fff;
            padding: 10px 22px; border-radius: 8px;
            z-index: 10001; display: none;
            font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }
        .toast.error { background: rgba(211,47,47,0.9); }
        .toast.success { background: rgba(56,142,60,0.9); }

        /* ===== MODALS ===== */
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 20000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #2d2d2d;
            border-radius: 12px; padding: 24px;
            width: 90%; max-width: 380px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .modal-content h3 {
            margin-bottom: 16px;
            color: #e0e0e0; font-weight: 600;
            font-size: 15px;
        }
        .modal-content input {
            width: 100%; padding: 10px 12px;
            margin-bottom: 16px;
            background: #3c3c3c; border: 1px solid #555;
            border-radius: 6px; color: #fff; font-size: 13px;
            outline: none; transition: border-color 0.15s ease;
        }
        .modal-content input:focus { border-color: #007acc; }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn {
            padding: 7px 18px; border-radius: 5px;
            border: none; cursor: pointer; font-size: 12px;
            font-family: inherit; transition: all 0.12s ease;
        }
        .modal-btn.primary { background: #007acc; color: #fff; }
        .modal-btn.primary:hover { background: #1a8ae8; }
        .modal-btn.secondary { background: rgba(255,255,255,0.08); color: #ccc; }
        .modal-btn.secondary:hover { background: rgba(255,255,255,0.14); }

        /* ===== CLOUD SAVE BACKGROUND ===== */
        @keyframes cloudFloat1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(30px, -8px); }
            66% { transform: translate(-20px, -12px); }
        }
        @keyframes cloudFloat2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-25px, -10px); }
            66% { transform: translate(15px, -5px); }
        }

        .modal.cloud-save {
            background:
                radial-gradient(ellipse 300px 200px at 80% 8%, rgba(255,200,100,0.15) 0%, transparent 100%),
                linear-gradient(165deg, #0a2647 0%, #1a5276 30%, #2e86c1 55%, #85c1e9 80%, #d6eaf8 100%);
            backdrop-filter: none;
        }
        .modal.cloud-save .modal-content {
            position: relative;
            z-index: 1;
        }
        .modal.cloud-save::before,
        .modal.cloud-save::after {
            content: '';
            position: absolute;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }
        .modal.cloud-save::before {
            width: 220px; height: 60px;
            background: rgba(255,255,255,0.10);
            border-radius: 60px;
            top: 12%; left: 8%;
            box-shadow:
                50px -18px 0 8px rgba(255,255,255,0.08),
                110px -28px 0 0 rgba(255,255,255,0.10),
                150px 5px 0 -8px rgba(255,255,255,0.05),
                -35px -8px 0 5px rgba(255,255,255,0.06);
            animation: cloudFloat1 14s ease-in-out infinite;
        }
        .modal.cloud-save::after {
            width: 160px; height: 45px;
            background: rgba(255,255,255,0.07);
            border-radius: 45px;
            bottom: 20%; right: 10%;
            box-shadow:
                35px -14px 0 6px rgba(255,255,255,0.05),
                80px -22px 0 0 rgba(255,255,255,0.07),
                -20px 0 0 3px rgba(255,255,255,0.04);
            animation: cloudFloat2 18s ease-in-out infinite;
        }

        /* ===== CLOUD FILE PICKER ===== */
        .modal-content.file-picker {
            max-width: 420px; max-height: 80vh;
            display: flex; flex-direction: column;
            padding: 20px;
        }
        .file-picker-search {
            width: 100%; padding: 8px 12px;
            margin-bottom: 12px;
            background: #3c3c3c; border: 1px solid #555;
            border-radius: 6px; color: #fff; font-size: 13px;
            outline: none; transition: border-color 0.15s ease;
        }
        .file-picker-search:focus { border-color: #007acc; }
        .file-picker-list {
            flex: 1; overflow-y: auto;
            max-height: 300px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .file-picker-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; margin-bottom: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px; cursor: pointer;
            transition: all 0.12s ease;
            font-size: 13px; color: #ccc;
        }
        .file-picker-item:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .file-picker-item:active {
            transform: scale(0.98);
        }
        .file-picker-item .file-icon { font-size: 16px; flex-shrink: 0; }
        .file-picker-item .file-name {
            flex: 1; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .file-picker-count {
            font-size: 11px; color: #888;
            text-align: center; margin-top: 8px;
        }
        body.light-theme .file-picker-search { background: #f5f5f5; border-color: #ccc; color: #333; }
        body.light-theme .file-picker-item { background: rgba(0,0,0,0.04); color: #555; }
        body.light-theme .file-picker-item:hover { background: rgba(0,0,0,0.08); color: #222; }
        body.light-theme .file-picker-count { color: #aaa; }

        /* Encrypted file picker - purple/cyan accent */
        .encrypt-picker h3 { color: #ce93d8; }
        .encrypt-picker .file-picker-search { border-color: #7b1fa2; }
        .encrypt-picker .file-picker-search:focus { border-color: #ce93d8; }

        /* ===== LIGHT THEME OVERRIDES ===== */
        body.light-theme { background: #f5f5f5; color: #333; }
        body.light-theme .toolbar { background: #e8e8e8; border-color: #ddd; }
        body.light-theme .toolbar-btn { color: #555; }
        body.light-theme .toolbar-btn:hover { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1); }
        body.light-theme .toolbar-group { background: rgba(0,0,0,0.04); }
        body.light-theme .lang-wrap { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
        body.light-theme .lang-wrap select { color: #333; }
        body.light-theme .lang-wrap select option { background: #fff; color: #333; }
        body.light-theme .tabs-container { background: #e0e0e0; border-color: #ddd; }
        body.light-theme .tab { background: #e8e8e8; color: #666; border-color: #ddd; }
        body.light-theme .tab:hover { background: #eee; color: #333; }
        body.light-theme .tab.active { background: #f5f5f5; color: #222; box-shadow: inset 0 -2px 0 #007acc; }
        body.light-theme .bottom-panel { background: #fafafa; border-color: #ddd; }
        body.light-theme .panel-tabs { background: #e8e8e8; }
        body.light-theme .panel-tab { color: #888; }
        body.light-theme .panel-tab:hover { color: #555; }
        body.light-theme .panel-tab.active { color: #222; border-bottom-color: #007acc; }
        body.light-theme .panel-output { color: #333; }
        body.light-theme .panel-output .output-stdout { color: #333; }
        body.light-theme .panel-output .output-stderr { color: #c62828; }
        body.light-theme .panel-output .output-error { color: #d32f2f; }
        body.light-theme .panel-output .output-info { color: #2e7d32; }
        body.light-theme .panel-output .output-warn { color: #f9a825; }
        body.light-theme .panel-resize-handle::after { background: rgba(0,0,0,0.12); }
        body.light-theme .panel-resize-handle:hover::after { background: #007acc; }
        body.light-theme .status-bar { background: #007acc; }
        body.light-theme .modal-content { background: #fff; }
        body.light-theme .modal-content h3 { color: #333; }
        body.light-theme .modal-content input { background: #f5f5f5; border-color: #ccc; color: #333; }
        body.light-theme .modal-btn.secondary { background: rgba(0,0,0,0.06); color: #555; }
        body.light-theme .modal-btn.secondary:hover { background: rgba(0,0,0,0.1); }
        body.light-theme .modal.cloud-save {
            background:
                radial-gradient(ellipse 300px 200px at 80% 8%, rgba(255,180,80,0.15) 0%, transparent 100%),
                linear-gradient(165deg, #93c5e0 0%, #b8d8f0 30%, #d4e8f5 60%, #edf6fa 100%);
        }
        body.light-theme .modal.cloud-save::before { background: rgba(255,255,255,0.3); box-shadow: 50px -18px 0 8px rgba(255,255,255,0.25),110px -28px 0 0 rgba(255,255,255,0.3),150px 5px 0 -8px rgba(255,255,255,0.2),-35px -8px 0 5px rgba(255,255,255,0.2); }
        body.light-theme .modal.cloud-save::after { background: rgba(255,255,255,0.25); box-shadow: 35px -14px 0 6px rgba(255,255,255,0.2),80px -22px 0 0 rgba(255,255,255,0.25),-20px 0 0 3px rgba(255,255,255,0.18); }
        body.light-theme .cloud-badge { background: rgba(255,167,38,0.15); color: #e65100; }

        /* ===== ENCRYPT-SAVE MODAL BACKGROUND ===== */
        .modal.encrypt-save {
            background: rgba(10,5,20,0.85);
            backdrop-filter: none;
        }
        .modal.encrypt-save .modal-content {
            border-color: rgba(0,255,136,0.2);
        }
        body.light-theme .modal.encrypt-save {
            background: rgba(240,235,250,0.85);
        }

    
    </style>
</head>
<body>

<div class="toolbar">
    <div class="toolbar-group">
        <button id="newFileBtn" class="toolbar-btn">📄 New</button>
        <button id="saveBtn" class="toolbar-btn">💾 Save</button>
        <button id="openBtn" class="toolbar-btn">📂 Open</button>
    </div>

    <div class="toolbar-group">
        <button id="runBtn" class="toolbar-btn run-btn" title="Run in-process (Ctrl+Enter)">▶️ Run</button>
        <button id="previewBtn" class="toolbar-btn preview-btn" title="Preview HTML" style="display:none">👁️ Preview</button>
        <button id="stopBtn" class="toolbar-btn stop-btn" title="Stop execution" style="display:none">⏹ Stop</button>
    </div>

    <div class="toolbar-group">
        <button id="saveEncryptedBtn" class="toolbar-btn encrypt-btn">🔒 Encrypt</button>
        <button id="openEncryptedBtn" class="toolbar-btn encrypt-btn">🔓 Decrypt</button>
        <button id="saveCloudBtn" class="toolbar-btn cloud-btn">☁️ Cloud</button>
        <button id="restoreCloudBtn" class="toolbar-btn cloud-btn">📥 Restore</button>
        <button id="refreshCloudBtn" class="toolbar-btn">🔄</button>
    </div>

    <div class="toolbar-group">
        <button id="togglePanelBtn" class="toolbar-btn" title="Toggle terminal / output panel">🖥️ Terminal</button>
        <button id="devtoolsBtn" class="toolbar-btn">🔧 DevTools</button>
    </div>

    <div class="toolbar-group">
        <button id="premiumBtn" class="toolbar-btn" style="color:#ffd700" title="Get NobleHyve Premium">⭐ Premium</button>
        <button id="defaultBrowserBtn" class="toolbar-btn" style="color:#4fc3f7;font-size:11px" title="Set NobleHyve as your default browser">🌐 Set Default</button>
    </div>

    <div class="lang-wrap">
        <select id="languageSelect">
            <option value="javascript">JavaScript</option>

    function showInputModal(title, defaultValue = '') {

            okBtn.onclick = onOk;
            cancelBtn.onclick = onCancel;
            input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); onOk(); } };

    async function openEncryptedFile() {
        const start = Date.now();
        const pickerModal = document.getElementById('encryptedFilePicker');
        const pwModal = document.getElementById('passwordModal');
        pickerModal.classList.add('encrypt-save');
        const r = await window.editorAPI.listEncryptedFiles();
        pickerModal.classList.remove('encrypt-save');
        if (!r.success || !r.files || r.files.length === 0) {
            showToast('No encrypted (.enc) files found on desktop', 'info');
            return;
        }
        const file = await showEncryptedFilePicker(r.files);
        if (!file) return;
        pwModal.classList.add('encrypt-save');
        const pw = await showPasswordModal(`Enter password for "${file.name}":`);
        pwModal.classList.remove('encrypt-save');
        if (!pw) return;
        showToast('Decrypting...', 'info');
        try {
            const dec = await window.editorAPI.readEncryptedFile(file.path, pw);
            if (dec.success) {
                const filename = file.name.replace(/\.enc$/i, '') || file.name;
                pipeline.perf('decrypt-open', filename, start);
                createNewTab(filename, dec.content);
                showToast(`✅ Decrypted: ${file.name}`, 'success');
            } else {
                showToast('Decryption failed: ' + (dec.error || 'Wrong password'), 'error');
            }
        } catch (e) {
            showToast('Failed to open encrypted file: ' + e.message, 'error');
        }
    }
    
    function getDefaultContent(filename) {

</head>
<body>
    <h1>Hello NobleHyve!</h1>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;

        } else if (ext === 'py') {

print("Hello, NobleHyve!")`;

puts "Hello, NobleHyve!"`;
        } else if (ext === 'rs') {

    function updateUIForTab(tab) {
        if (!tab) return;
        editor.setValue(tab.content);
        document.getElementById('languageSelect').value = tab.language;
        document.getElementById('statusText').innerHTML = tab.isModified ? '<span class="status-item modified">✏️ Modified</span>' : 'Ready';
        document.getElementById('fileInfo').innerHTML = tab.isEncrypted ? `🔒 ${tab.filename}` : `📄 ${tab.filename}`;
        document.title = `${tab.filename} - NobleHyve Editor`;
        
        editor.setOption('mode', modeMap[tab.language] || null);
        
        const previewBtn = document.getElementById('previewBtn');

function updateTabsUI() {
    const tabsContainer = document.getElementById('tabsContainer');
    const newTabBtn = document.getElementById('newTabBtn');
    
    // Remove existing tabs (keep the "+" button)
    const existingTabs = tabsContainer.querySelectorAll('.tab');
    existingTabs.forEach(tab => tab.remove());

    tabs.forEach(tab => {
        const tabBtn = document.createElement('div');
        tabBtn.className = 'tab';
        if (activeTabId === tab.id) tabBtn.classList.add('active');
        tabBtn.dataset.tabId = tab.id;

        // Show modified indicator (*) if the file has unsaved changes
        const titleText = tab.isModified ? `${tab.filename} *` : tab.filename;
        tabBtn.innerHTML = `<span class="tab-title">${titleText}</span><span class="close-tab">✖</span>`;

        // Switch tab on click (but not on close button)
        tabBtn.addEventListener('click', (e) => {
            if (!e.target.classList.contains('close-tab')) switchToTab(tab.id);
        });

        // Close tab
        tabBtn.querySelector('.close-tab').addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(tab.id);
        });

        // Double-click to rename
        tabBtn.querySelector('.tab-title').addEventListener('dblclick', (e) => {
            e.stopPropagation();
            renameTab(tab.id);
        });

        tabsContainer.insertBefore(tabBtn, newTabBtn);
    });
}

async function renameTab(id) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;

    const newName = prompt('Rename file:', tab.filename);
    if (!newName || newName.trim() === '' || newName === tab.filename) return;

    const oldName = tab.filename;
    const oldPath = tab.filePath;

    // Update tab object
    tab.filename = newName.trim();
    // Update language if extension changed
    const newLang = getLanguageFromFilename(tab.filename);
    if (newLang !== tab.language) {
        tab.language = newLang;
    }
    tab.isModified = true;  // filename change is a modification
    updateUIForTab(tab);
    updateTabsUI();
    showToast(`Renamed to ${tab.filename}`, 'success');

    // If the file has a physical path, rename the actual file on disk
    if (oldPath) {
        const result = await window.editorAPI.renameFile(oldPath, tab.filename);
        if (result.success) {
            tab.filePath = result.newPath;
            showToast(`File renamed on disk`, 'success');
        } else {
            showToast(`Could not rename file on disk: ${result.error}`, 'error');
            // Optionally revert the tab name? We'll keep it as is, but user should know.
        }
    }
}
    
    function switchToTab(id) {
        const tab = tabs.find(t => t.id === id);
        if (!tab) return;
        if (activeTabId !== null) {
            const oldTab = tabs.find(t => t.id === activeTabId);
            if (oldTab) oldTab.content = editor.getValue();
        }
        activeTabId = id;
        updateUIForTab(tab);
        updateTabsUI();
        updateWorkspaceDisplay();
    }
    
    function createNewTab(filename = null, content = null) {
        const id = nextTabId++;
        const tabFilename = filename || `Untitled_${id}.js`;
        const tabContent = content || getDefaultContent(tabFilename);
        const language = getLanguageFromFilename(tabFilename);
        const tab = new EditorTab(id, tabFilename, tabContent, language);
        tabs.push(tab);
        updateTabsUI();
        switchToTab(id);
        return id;
    }
    
    async function closeTab(id) {
        if (tabs.length === 1) {
            const currentTab = tabs[0];
            if (currentTab.isModified) {
                if (confirm(`Save "${currentTab.filename}" before clearing?`)) await saveCurrentFile();
            }
            currentTab.content = getDefaultContent(currentTab.filename);
            currentTab.isModified = false;
            currentTab.filePath = null;
            currentTab.isEncrypted = false;
            editor.setValue(currentTab.content);
            updateUIForTab(currentTab);
            updateTabsUI();
            showToast('Tab cleared. Create new tabs with the + button', 'info');
            return;
        }
        const tab = tabs.find(t => t.id === id);
        if (!tab) return;
        if (tab.isModified) {
            if (confirm(`Save "${tab.filename}" before closing?`)) await saveCurrentFileForTab(tab);
        }
        const index = tabs.findIndex(t => t.id === id);
        tabs.splice(index, 1);
        if (tabs.length > 0) {
            const newActiveId = tabs[Math.min(index, tabs.length - 1)].id;
            switchToTab(newActiveId);
        }
        updateTabsUI();
        showToast(`Closed: ${tab.filename}`, 'info');
    }
    
    async function saveCurrentFileForTab(tab) {
        const start = Date.now();
        tab.content = editor.getValue();
        if (tab.filePath) {
            const r = await window.editorAPI.writeFile(tab.filePath, tab.content);
            if (r.success) { tab.isModified = false; showToast(`✅ Saved: ${tab.filename}`, 'success'); pipeline.perf('save', tab.filename, start); }
        } else {
            const r = await window.editorAPI.showSaveDialog({ defaultPath: tab.filename });
            if (!r.canceled) {
                const w = await window.editorAPI.writeFile(r.filePath, tab.content);
                if (w.success) {
                    tab.filePath = r.filePath;
                    tab.isModified = false;
                    tab.filename = r.filePath.split(/[/\\]/).pop();
                    showToast(`✅ Saved: ${tab.filename}`, 'success');
                    pipeline.perf('save-as', tab.filename, start);
                    updateTabsUI();
                }
            }
        }
        const dir = getFileDirSimple(tab);
        if (dir) { await window.editorAPI.setWorkspace(dir); updateWorkspaceDisplay(); }
    }
    
    async function saveCurrentFile() {
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return;
        await saveCurrentFileForTab(t);
        document.getElementById('statusText').innerHTML = 'Ready';
        updateTabsUI();
    }
    
async function openFile() {
    const start = Date.now();
    const r = await window.editorAPI.showOpenDialog();
    if (r.canceled) return;

    const filePath = r.filePaths[0];

    try {
        const c = await window.editorAPI.readFile(filePath);

        if (c.success) {
            const filename = filePath.split(/[/\\]/).pop();
            createNewTab(filename, c.content);
            const t = tabs[tabs.length - 1];
            t.filePath = filePath;
            t.isEncrypted = filename.endsWith('.enc');
            t.isModified = false;
            pipeline.perf('open', filename, start);
            showToast(`📂 Opened: ${filename}`, 'success');
            const dir = getFileDirSimple(t);
            if (dir) { await window.editorAPI.setWorkspace(dir); updateWorkspaceDisplay(); }
        } else {
            showToast(`Failed to read file: ${c.error}`, 'error');
        }
    } catch (err) {
        showToast(`Error opening file: ${err.message}`, 'error');
    }
}
    
    async function saveEncryptedToFile() {
        const start = Date.now();
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return;
        t.content = editor.getValue();
        const inputModal = document.getElementById('inputModal');
        const pwModal = document.getElementById('passwordModal');
        inputModal.classList.add('encrypt-save');
        const fn = await showInputModal('🔒 Save encrypted file:', t.filename.replace(/\.enc$/, '') + '.enc');
        inputModal.classList.remove('encrypt-save');
        if (!fn) return;
        const finalFile = fn.endsWith('.enc') ? fn : fn + '.enc';
        pwModal.classList.add('encrypt-save');
        const pw = await showPasswordModal('Enter encryption password:');
        if (!pw) { pwModal.classList.remove('encrypt-save'); return; }
        const pw2 = await showPasswordModal('Confirm password:');
        pwModal.classList.remove('encrypt-save');
        if (pw !== pw2) { showToast('Passwords do not match!', 'error'); return; }
        const r = await window.editorAPI.saveEncryptedFile(finalFile, t.content, pw);
        if (r.success) {
            t.filePath = r.path; t.isEncrypted = true; t.isModified = false; t.filename = finalFile;
            pipeline.perf('encrypt-save', finalFile, start);
            showToast(`✅ Encrypted: ${finalFile}`, 'success');
            updateTabsUI();
            await loadUsageStatus();
        } else {
            showToast('Encryption failed: ' + (r.error || 'Unknown error'), 'error');
        }
    }
    
    async function loadCloudFiles() {
        try {
            const r = await window.editorAPI.listCloudFiles();
            if (r.success && r.files) {
                cloudFiles = r.files.map(n => ({ name: n }));
                const tierIcon = usageStatus?.isPremium ? '⭐' : '☁️';
                document.getElementById('cloudFileCount').textContent = `${tierIcon} ${cloudFiles.length} files`;
            } else {
                const errMsg = r.error || JSON.stringify(r);
                showToast('Cloud list error: ' + errMsg, 'error');
                console.error('Cloud list failed:', r);
            }
        } catch (e) { showToast('Failed to list cloud files: ' + e.message, 'error'); }
    }

    async function loadUsageStatus() {
        try {
            usageStatus = await window.editorAPI.getUsageStatus();
            isPremium = usageStatus.isPremium;
            updateUsageUI();
        } catch (e) { console.error('Failed to load usage status:', e); }
    }

    function updateUsageUI() {
        const badge = document.getElementById('usageBadge');
        if (!badge) return;
        if (!usageStatus) return;
        const usedMB = (usageStatus.cloudBytesUsed / (1024 * 1024)).toFixed(1);
        const maxMB = Math.round(usageStatus.cloudMaxBytes / (1024 * 1024));
        const fileCount = usageStatus.cloudFileCount || 0;
        if (!usageStatus.isPremium) {
            badge.textContent = `☁️ ${fileCount} files · ${usedMB} MB / ${maxMB} MB`;
            badge.style.background = 'rgba(255,152,0,0.15)';
            badge.style.color = '#ff9800';
        } else {
            badge.textContent = `⭐ Premium · ${fileCount} files · ${usedMB} MB / ${maxMB} MB`;
            badge.style.background = 'rgba(76,175,80,0.15)';
            badge.style.color = '#4caf50';
        }
    }
    
    async function uploadToCloud() {
        const start = Date.now();
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return;
        t.content = editor.getValue();
        if (!usageStatus) await loadUsageStatus();
        const inputModal = document.getElementById('inputModal');
        const pwModal = document.getElementById('passwordModal');
        inputModal.classList.add('cloud-save');
        const fn = await showInputModal('Enter filename:', t.filename);
        inputModal.classList.remove('cloud-save');
        if (!fn) return;
        pwModal.classList.add('cloud-save');
        const pw = await showPasswordModal('Enter encryption password:');
        if (!pw) { pwModal.classList.remove('cloud-save'); return; }
        const pw2 = await showPasswordModal('Confirm password:');
        pwModal.classList.remove('cloud-save');
        if (pw !== pw2) { showToast('Passwords do not match!', 'error'); return; }
        showToast('Encrypting and uploading...', 'info');
        try {
            const enc = await window.editorAPI.encryptContent(t.content, pw);
            const r = await window.editorAPI.uploadToCloud(fn, enc);
            if (r.success) { pipeline.perf('cloud-upload', fn, start); showToast(`✅ Saved "${fn}" to cloud!`, 'success'); await loadCloudFiles(); await loadUsageStatus(); }
            else { showToast('Upload failed: ' + r.error, 'error'); }
        } catch (e) { showToast('Upload failed: ' + e.message, 'error'); }
    }
    
    async function restoreFromCloud() {
        const start = Date.now();
        if (cloudFiles.length === 0) await loadCloudFiles();
        if (cloudFiles.length === 0) { showToast('No files in cloud', 'info'); return; }
        const pickerModal = document.getElementById('cloudFilePicker');
        const pwModal = document.getElementById('passwordModal');
        pickerModal.classList.add('cloud-save');
        const fn = await showCloudFilePicker(cloudFiles);
        pickerModal.classList.remove('cloud-save');
        if (!fn) return;
        pwModal.classList.add('cloud-save');
        const pw = await showPasswordModal(`Enter password for "${fn}":`);
        pwModal.classList.remove('cloud-save');
        if (!pw) return;
        showToast('Downloading...', 'info');
        try {
            const r = await window.editorAPI.downloadFromCloud(fn);
            const dec = await window.editorAPI.decryptContent(r.content, pw);
            if (dec) { pipeline.perf('cloud-download', fn, start); createNewTab(fn, dec); showToast(`✅ Restored "${fn}"!`, 'success'); }
            else { showToast('Wrong password!', 'error'); }
        } catch (e) { showToast('Restore failed: ' + e.message, 'error'); }
    }
    
    function toggleDevTools() {
        if (window.editorAPI?.toggleDevTools) window.editorAPI.toggleDevTools();
    }
    
    // ============ OUTPUT PANEL ============
    function showOutput() {
        const panel = document.getElementById('bottomPanel');
        if (!panel) return;
        const toggleBtn = document.getElementById('togglePanelBtn');
        const handle = document.getElementById('panelResizeHandle');
        panel.classList.add('open'); outputVisible = true;
        if (toggleBtn) toggleBtn.classList.add('active');
        if (handle) handle.style.display = 'flex';
        switchTab('output');
    }
    
    function hideOutput() {
        const panel = document.getElementById('bottomPanel');
        if (!panel) return;
        const toggleBtn = document.getElementById('togglePanelBtn');
        const handle = document.getElementById('panelResizeHandle');
        panel.classList.remove('open'); outputVisible = false;
        if (toggleBtn) toggleBtn.classList.remove('active');
        if (handle) handle.style.display = 'none';
    }
    
    function clearOutput() {
        const content = document.getElementById('outputContent');
        if (content) content.innerHTML = '';
    }
    
    function appendOutput(text, className = 'output-stdout') {
        showOutput();
        const content = document.getElementById('outputContent');
        if (content) {
            const line = document.createElement('div');
            line.className = className;
            line.textContent = text;
            content.appendChild(line);
            content.scrollTop = content.scrollHeight;
        }
    }

    function switchTab(name) {
        document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
        document.querySelectorAll('.panel-body > .tab-content').forEach(t => t.classList.toggle('active', t.id === name + 'Container'));
    }
    
    // ============ RUN / EXECUTION ============
    function getActiveCode() {
        const t = tabs.find(t => t.id === activeTabId);
        if (!t) return null;
        t.content = editor.getValue();
        return t;
    }
    
    async function runCode() {
        if (executionInProgress) { appendOutput('Execution already in progress', 'output-warn'); return; }
        const tab = getActiveCode();
        if (!tab) return;
        
        const start = Date.now();
        clearOutput();
        appendOutput(`▶ Running ${tab.filename} (${tab.language})...`, 'output-info');
        
        const lang = tab.language;
        const code = tab.content;
        executionInProgress = true;
        document.getElementById('runBtn').disabled = true;
        document.getElementById('stopBtn').style.display = 'inline-block';
        
        try {
            if (lang === 'javascript') {
                await runJavaScript(code);
            } else if (lang === 'html') {
                await runHTML(code);
            } else if (lang === 'css') {
                appendOutput('CSS cannot be run directly. Use it within an HTML file.', 'output-warn');
            } else if (runnableViaMain.includes(lang)) {
                await runViaMainProcess(lang, code);
            } else {
                appendOutput(`No execution strategy for "${lang}"`, 'output-warn');
            }
        } catch (err) {
            appendOutput(`Error: ${err.message || err}`, 'output-error');
        }
        
        pipeline.perf('run-code', `${tab.filename} (${lang})`, start);
        executionInProgress = false;
        document.getElementById('runBtn').disabled = false;
        document.getElementById('stopBtn').style.display = 'none';
        appendOutput('', 'output-info');
        appendOutput('═══════════════════════', 'output-info');
        appendOutput('Execution finished', 'output-info');
    }
    
    function runJavaScript(code) {
        return new Promise((resolve) => {
            const output = [];
            const fakeConsole = {
                log: (...args) => { output.push(args.map(String).join(' ')); appendOutput(args.map(String).join(' ')); },
                warn: (...args) => { output.push('⚠ ' + args.map(String).join(' ')); appendOutput(args.map(String).join(' '), 'output-warn'); },
                error: (...args) => { output.push('✖ ' + args.map(String).join(' ')); appendOutput(args.map(String).join(' '), 'output-stderr'); },
                info: (...args) => { output.push('ℹ ' + args.map(String).join(' ')); appendOutput(args.map(String).join(' '), 'output-info'); }
            };
            try {
                const wrapped = `(function(console){ ${code} \n})`;
                const fn = eval(wrapped);
                const result = fn(fakeConsole);
                if (result !== undefined && result !== null) {
                    appendOutput(`=> ${result}`, 'output-info');
                }
            } catch (e) {
                appendOutput(`${e.name}: ${e.message}`, 'output-error');
            }
            resolve();
        });
    }
    
    function runHTML(code) {
        return new Promise((resolve) => {
            showPreview(code);
            appendOutput('HTML rendered in preview panel', 'output-info');
            resolve();
        });
    }
    
    async function runViaMainProcess(lang, code) {
        appendOutput(`Executing via system (${lang})...`, 'output-info');
        try {
            const result = await window.editorAPI.executeCode({ language: lang, code: code });
            if (result.success) {
                if (result.stdout) appendOutput(result.stdout);
                if (result.stderr) appendOutput(result.stderr, 'output-stderr');
                if (result.exitCode !== 0) appendOutput(`Exit code: ${result.exitCode}`, 'output-error');
            } else {
                appendOutput(`Execution failed: ${result.error}`, 'output-error');
            }
        } catch (e) {
            appendOutput(`Failed to execute: ${e.message}`, 'output-error');
        }
    }
    
    // ============ PREVIEW ============
    function showPreview(code) {
        const overlay = document.getElementById('previewOverlay');
        const frame = document.getElementById('previewFrame');
        if (!overlay || !frame) return;
        overlay.style.display = 'flex';
        frame.srcdoc = code;
    }
    
    function closePreview() {
        const overlay = document.getElementById('previewOverlay');
        const frame = document.getElementById('previewFrame');
        if (overlay) overlay.style.display = 'none';
        if (frame) frame.srcdoc = '';
    }
    
    // ============ TERMINAL INTEGRATION ============
    function getFileDirSimple(tab) {
        if (!tab || !tab.filePath) return null;
        const idx = Math.max(tab.filePath.lastIndexOf('/'), tab.filePath.lastIndexOf('\\'));
        return idx >= 0 ? tab.filePath.substring(0, idx) : null;
    }
    
    async function updateWorkspaceDisplay() {
        const tab = tabs.find(t => t.id === activeTabId);
        let dir = null;
        if (tab && tab.filePath) {
            dir = getFileDirSimple(tab);
        }
        if (!dir) {
            try {
                const ws = await window.editorAPI.getWorkspace();
                if (ws.success && ws.dir) dir = ws.dir;
            } catch (_) {}
        }
        const el = document.getElementById('workspaceDisplay');
        if (el) el.textContent = dir ? `📁 ${dir}` : '📁 —';
        return dir;
    }
    
    // ============ EMBEDDED TERMINAL ============
    let terminalSessionId = 'editor-terminal';
    let xterm = null;
    let fitAddon = null;
    let termCleanup = null;
    let terminalStarted = false;

    async function startTerminal() {
        if (terminalStarted) return;
        terminalStarted = true;
        const container = document.getElementById('terminalContainer');
        if (!container) return;
        
        xterm = new Terminal({
            cursorBlink: true, fontSize: 13,
            fontFamily: "'Cascadia Code', 'Consolas', 'Monaco', monospace",
            theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#ffffff',
                black: '#0c0c0c', red: '#f48771', green: '#6a9955', yellow: '#ffaa44',
                blue: '#569cd6', magenta: '#c586c0', cyan: '#4ec9b0', white: '#d4d4d4' },
            scrollback: 5000, convertEol: true,
        });
        fitAddon = new FitAddon.FitAddon();
        xterm.loadAddon(fitAddon);
        xterm.open(container);
        fitAddon.fit();

        let fitTimer;
        new ResizeObserver(() => {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(() => { try { fitAddon.fit(); } catch(e) {} }, 100);
        }).observe(container);

        let resizeTimer;
        xterm.onResize(({ cols, rows }) => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window.editorAPI.resizeTerminal) {
                    window.editorAPI.resizeTerminal(terminalSessionId, cols, rows);
                }
            }, 150);
        });

        if (window.editorAPI.onTerminalData) {
            const cleanup = window.editorAPI.onTerminalData((data) => {
                if (data && data.id === terminalSessionId) {
                    xterm.write(data.data ?? data);
                }
            });
            termCleanup = cleanup;
        }

        if (window.editorAPI.onTerminalExit) {
            window.editorAPI.onTerminalExit(({ id, exitCode }) => {
                if (id === terminalSessionId) {
                    xterm.write(`\r\n[Session ended — exit code ${exitCode}]\r\n`);
                }
            });
        }

        xterm.onData((data) => {
            if (window.editorAPI.writeToTerminal) {
                window.editorAPI.writeToTerminal(terminalSessionId, data);
            }
        });

        try {
            const { cols, rows } = xterm;
            const result = await window.editorAPI.createTerminalSession(terminalSessionId, null, null, cols, rows);
            if (result && result.success) {
                xterm.write('\x1b[32m✓ Terminal Ready\x1b[0m\r\n');
            } else {
                xterm.write('\x1b[31mFailed to start terminal session\x1b[0m\r\n');
            }
        } catch (err) {
            xterm.write(`\x1b[31mError: ${err.message}\x1b[0m\r\n`);
        }
    }

    // ============ INIT ============
    document.addEventListener('DOMContentLoaded', async () => {
        const textarea = document.getElementById('editor');
        editor = CodeMirror.fromTextArea(textarea, {
            mode: 'javascript',
            theme: 'dracula',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            styleActiveLine: true,
            foldGutter: true,
            gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
            extraKeys: {
                'Ctrl-S': () => saveCurrentFile(),
                'Cmd-S': () => saveCurrentFile(),
                'Ctrl-Enter': () => runCode(),
                'Cmd-Enter': () => runCode()
            }
        });
        
        editor.on('change', () => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab && !tab.isModified) {
                tab.isModified = true;
                document.getElementById('statusText').innerHTML = '<span class="status-item modified">✏️ Modified</span>';
            }
        });
        
        // Toolbar buttons
        document.getElementById('newFileBtn')?.addEventListener('click', () => createNewTab());
        document.getElementById('newTabBtn')?.addEventListener('click', () => createNewTab());
        document.getElementById('saveBtn')?.addEventListener('click', saveCurrentFile);
        document.getElementById('openBtn')?.addEventListener('click', openFile);
        document.getElementById('saveEncryptedBtn')?.addEventListener('click', saveEncryptedToFile);
        document.getElementById('openEncryptedBtn')?.addEventListener('click', openEncryptedFile);
        document.getElementById('saveCloudBtn')?.addEventListener('click', uploadToCloud);
        document.getElementById('restoreCloudBtn')?.addEventListener('click', restoreFromCloud);
        document.getElementById('refreshCloudBtn')?.addEventListener('click', loadCloudFiles);
        document.getElementById('devtoolsBtn')?.addEventListener('click', toggleDevTools);
        document.getElementById('premiumBtn')?.addEventListener('click', () => {
            if (window.editorAPI?.openPremiumPage) {
                window.editorAPI.openPremiumPage();
            }
        });
        document.getElementById('defaultBrowserBtn')?.addEventListener('click', async () => {
            if (window.editorAPI?.setAsDefaultBrowser) {
                const result = await window.editorAPI.setAsDefaultBrowser();
                if (result.success) {
                    showToast('✅ NobleHyve is now your default browser', 'success');
                } else {
                    showToast('Failed to set as default: ' + (result.error || 'unknown error'), 'error');
                }
            }
        });
        
        // Run / Preview buttons
        document.getElementById('runBtn')?.addEventListener('click', runCode);
        document.getElementById('previewBtn')?.addEventListener('click', () => {
            const t = tabs.find(t => t.id === activeTabId);
            if (t) { t.content = editor.getValue(); showPreview(t.content); }
        });
        document.getElementById('stopBtn')?.addEventListener('click', () => {
            executionInProgress = false;
            document.getElementById('runBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
            appendOutput('Execution stopped by user', 'output-warn');
        });
        
        // Bottom panel: tab switching
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                togglePanel(true);
                switchTab(tab.dataset.tab);
                if (tab.dataset.tab === 'terminal') startTerminal();
            });
        });
        
        // Bottom panel: close
        document.getElementById('closePanelBtn')?.addEventListener('click', () => togglePanel(false));
        
        // Bottom panel: toggle panel button (toolbar)
        const toggleBtn = document.getElementById('togglePanelBtn');
        function togglePanel(open) {
            const panel = document.getElementById('bottomPanel');
            if (!panel) return;
            const handle = document.getElementById('panelResizeHandle');
            if (open === undefined) open = !panel.classList.contains('open');
            panel.classList.toggle('open', open);
            if (toggleBtn) toggleBtn.classList.toggle('active', open);
            if (open) {
                if (handle) handle.style.display = 'flex';
                switchTab('terminal');
                startTerminal();
            } else {
                if (handle) handle.style.display = 'none';
            }
        }
        toggleBtn?.addEventListener('click', () => togglePanel());
        
        // Bottom panel: status bar terminal button
        document.getElementById('statusTerminalBtn')?.addEventListener('click', () => togglePanel());
        
        // Output buttons
        document.getElementById('clearOutputBtn')?.addEventListener('click', clearOutput);
        
        // Preview close
        document.getElementById('closePreviewBtn')?.addEventListener('click', closePreview);
        
        // Language selector
        document.getElementById('languageSelect')?.addEventListener('change', (e) => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.language = e.target.value;
                editor.setOption('mode', modeMap[e.target.value] || null);
                const previewBtn = document.getElementById('previewBtn');
                if (previewBtn) previewBtn.style.display = (e.target.value === 'html') ? 'inline-block' : 'none';
            }
        });
        
        await loadUsageStatus();
        await loadCloudFiles();
        createNewTab();
        await updateWorkspaceDisplay();
        
        // Panel resize handle setup
        (function() {
            const handle = document.getElementById('panelResizeHandle');
            const panel = document.getElementById('bottomPanel');
            if (!handle || !panel) return;
            let active = false;
            let startY, startH;
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                active = true;
                startY = e.clientY;
                startH = panel.offsetHeight;
                handle.classList.add('active');
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
            });
            document.addEventListener('mousemove', (e) => {
                if (!active) return;
                const delta = startY - e.clientY;
                const newH = Math.max(80, Math.min(startH + delta, window.innerHeight - 100));
                panel.style.height = newH + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (!active) return;
                active = false;
                handle.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });
        })();
        
        pipeline.send('editor', { action: 'editor-ready', loadTimeMs: Date.now() - windowStart });
        console.log('Editor ready!');
        showToast('✨ Editor ready! Ctrl+Enter to run code.', 'success');
    });
</script>
